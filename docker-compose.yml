# SuperBizAgent + Milvus standalone (etcd + minio + milvus)
# 使用方式：
#   1. 设置 DashScope API Key（必填，用于对话与向量化）
#      set DASHSCOPE_API_KEY=sk-xxxx
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost:9900
#
# 说明：应用启动时会连接 Milvus 并创建 collection；Milvus 未就绪时启动会失败，
# 因此 app 依赖 standalone 的 healthcheck。

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    build: .
    image: superbiz-agent:local
    ports:
      - "9900:9900"
    environment:
      # 在 Compose 网络中通过服务名访问 Milvus（不要用 localhost）
      MILVUS_HOST: standalone
      MILVUS_PORT: "19530"
      FILE_UPLOAD_PATH: /app/uploads
      # 未设置时 docker compose 会报错（见文件头说明）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in your environment}
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      standalone:
        condition: service_healthy

volumes:
  app-uploads:
